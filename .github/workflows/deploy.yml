name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    # Calls build.yml as a reusable workflow instead of linking two separate
    # workflow runs via workflow_run — this is what makes Build show up as a
    # connected stage in Deploy's own run graph instead of a second,
    # loosely-related entry in the Actions tab.
    uses: ./.github/workflows/build.yml

  staging:
    name: Deploy to staging (${{ matrix.app }})
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/transaction-dispute-portal-${{ matrix.app }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (staging)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:staging
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}

  production:
    name: Deploy to production (${{ matrix.app }})
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Gated on a required reviewer — configured on the "production" environment
    # in repo Settings → Environments, not expressible in this file. The job
    # triggers automatically on a v* tag push, same as staging, but GitHub
    # pauses it here until an authorized reviewer approves. See
    # docs/decisions.md #25 for the one-time setup step and why it can't be
    # done from the workflow itself.
    environment: production
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/transaction-dispute-portal-${{ matrix.app }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (production)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
