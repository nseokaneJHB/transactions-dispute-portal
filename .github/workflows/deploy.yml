name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    # Calls build.yml as a reusable workflow instead of linking two separate
    # workflow runs via workflow_run — this is what makes Build show up as a
    # connected stage in Deploy's own run graph instead of a second,
    # loosely-related entry in the Actions tab.
    uses: ./.github/workflows/build.yml

  staging:
    name: Deploy to staging (${{ matrix.app }})
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/transaction-dispute-portal-${{ matrix.app }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (staging)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:staging
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}

  tag:
    name: Create release tag
    needs: staging
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Auto-bumps the patch version and pushes the tag once staging succeeds
      # for both apps — this is the version marker for the images production
      # promotes below, not a manual release step. Pushing with GITHUB_TOKEN
      # doesn't start a second workflow run (GitHub suppresses that to avoid
      # loops), which is what we want: production stays in this same run,
      # gated on `needs: tag` rather than on a separate tag-push trigger.
      - name: Bump patch version and tag
        id: bump
        run: |
          git fetch --tags
          latest="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          latest="${latest:-v0.0.0}"
          IFS='.' read -r major minor patch <<< "${latest#v}"
          next="v${major}.${minor}.$((patch + 1))"
          git tag "$next"
          git push origin "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

  production:
    name: Deploy to production (${{ matrix.app }})
    needs: tag
    runs-on: ubuntu-latest
    # Gated on a required reviewer — configured on the "production" environment
    # in repo Settings → Environments, not expressible in this file. The job
    # is reachable as soon as `tag` finishes (same run as staging), but GitHub
    # pauses it here until an authorized reviewer approves — that's the
    # "Review deployments" button. See docs/decisions.md #25/#27 for the
    # one-time setup step and why it can't be done from the workflow itself.
    environment: production
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/transaction-dispute-portal-${{ matrix.app }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (production)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ needs.tag.outputs.tag }}
