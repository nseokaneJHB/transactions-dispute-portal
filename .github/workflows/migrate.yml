name: Migrate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment — its DATABASE_URL secret is migrated
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production

concurrency:
  group: migrate-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Run migrations (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify migration files match the schema snapshots
        run: pnpm --filter @transaction-dispute-portal/api exec drizzle-kit check

      - name: Require a DATABASE_URL secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::No DATABASE_URL secret on the '${{ github.event.inputs.environment }}' environment."
            echo "Add it under repo Settings -> Environments -> ${{ github.event.inputs.environment }} -> Secrets, then re-run."
            exit 1
          fi

      - name: Apply migrations
        run: pnpm --filter @transaction-dispute-portal/api migrate
