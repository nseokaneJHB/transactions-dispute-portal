name: Migrate

on:
  workflow_dispatch:

concurrency:
  group: migrate-staging
  cancel-in-progress: false

jobs:
  migrate:
    name: Run migrations (staging)
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify migration files match the schema snapshots
        run: pnpm --filter @transaction-dispute-portal/api exec drizzle-kit check

      - name: Require a DATABASE_URL secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::No DATABASE_URL secret on the 'staging' environment."
            echo "Add it under repo Settings -> Environments -> staging -> Secrets, then re-run."
            exit 1
          fi

      - name: Apply migrations
        run: pnpm --filter @transaction-dispute-portal/api migrate
