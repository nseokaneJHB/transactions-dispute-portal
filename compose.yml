name: transaction-dispute-portal

services:
  database:
    image: postgres:18-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: transaction-dispute

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile

    restart: unless-stopped
    working_dir: /workspace/api

    command:
      - sh
      - -c
      - >
        pnpm --filter @transaction-dispute-portal/shared build &&
        pnpm migrate &&
        pnpm dev

    env_file:
      - ./api/.env

    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "100"

    ports:
      - "8080:8080"

    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      - api_node_modules:/workspace/api/node_modules
      - shared_node_modules:/workspace/shared/node_modules

    depends_on:
      database:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:8080/healthz'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 90s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile

    restart: unless-stopped
    working_dir: /workspace/web

    command:
      - sh
      - -c
      - >
        pnpm --filter @transaction-dispute-portal/shared build &&
        pnpm dev --host 0.0.0.0

    env_file:
      - ./web/.env

    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "100"

    ports:
      - "3000:3000"

    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      - web_node_modules:/workspace/web/node_modules
      - shared_node_modules:/workspace/shared/node_modules

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:3000/'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 90s

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped

    ports:
      - "1025:1025"
      - "8025:8025"

  ntfy:
    image: binwiederhier/ntfy:latest
    command: serve
    restart: unless-stopped

    environment:
      NTFY_BASE_URL: http://localhost:8090
      NTFY_LISTEN_HTTP: ":80"

    ports:
      - "8090:80"

volumes:
  postgres_data:
  node_modules:
  api_node_modules:
  web_node_modules:
  shared_node_modules:
