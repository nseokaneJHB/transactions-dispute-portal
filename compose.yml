services:
  transaction-dispute-portal-database:
    image: postgres:18-alpine
    restart: unless-stopped

    env_file:
      - ./env/development/.env.database

    ports:
      - "5432:5432"

    volumes:
      - transaction-dispute-portal-postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - transaction-dispute-portal

  transaction-dispute-portal-api:
    image: transaction-dispute-portal-api
    build:
      context: .
      dockerfile: api/Dockerfile

    restart: unless-stopped
    working_dir: /workspace

    command:
      - sh
      - -c
      - >
        pnpm --filter @transaction-dispute-portal/api migrate &&
        pnpm --filter @transaction-dispute-portal/api dev --host 0.0.0.0

    env_file:
      - ./api/.env

    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "100"

    ports:
      - "8080:8080"

    volumes:
      - .:/workspace
      - transaction-dispute-portal-node_modules:/workspace/node_modules
      - transaction-dispute-portal-api-node_modules:/workspace/api/node_modules
      - transaction-dispute-portal-shared-node_modules:/workspace/shared/node_modules

    depends_on:
      transaction-dispute-portal-database:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:8080/healthz'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 90s

    networks:
      - transaction-dispute-portal

  transaction-dispute-portal-web:
    image: transaction-dispute-portal-web
    build:
      context: .
      dockerfile: web/Dockerfile

    restart: unless-stopped
    working_dir: /workspace

    env_file:
      - ./web/.env

    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "100"

    ports:
      - "3000:3000"

    volumes:
      - .:/workspace
      - transaction-dispute-portal-node_modules:/workspace/node_modules
      - transaction-dispute-portal-web-node_modules:/workspace/web/node_modules
      - transaction-dispute-portal-shared-node_modules:/workspace/shared/node_modules

    depends_on:
      transaction-dispute-portal-api:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:3000/'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 90s

    networks:
      - transaction-dispute-portal

  transaction-dispute-portal-mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped

    ports:
      - "8025:8025"
      - "1025:1025"

    networks:
      transaction-dispute-portal:
        aliases:
          - mailpit

  transaction-dispute-portal-ntfy:
    image: binwiederhier/ntfy:latest
    command: serve
    restart: unless-stopped

    environment:
      NTFY_BASE_URL: http://localhost:8090
      NTFY_LISTEN_HTTP: ":80"

    ports:
      - "8090:80"

    networks:
      transaction-dispute-portal:
        aliases:
          - ntfy

volumes:
  transaction-dispute-portal-postgres_data:
  transaction-dispute-portal-node_modules:
  transaction-dispute-portal-api-node_modules:
  transaction-dispute-portal-web-node_modules:
  transaction-dispute-portal-shared-node_modules:

networks:
  transaction-dispute-portal:
    driver: bridge
