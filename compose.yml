services:
  transaction-dispute-portal-database:
    image: postgres:18-alpine
    restart: unless-stopped

    env_file:
      - ./env/.env.database

    volumes:
      - transaction-dispute-portal-postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - transaction-dispute-portal

  transaction-dispute-portal-api:
    image: transaction-dispute-portal-api
    build:
      context: .
      dockerfile: api/Dockerfile

    restart: unless-stopped

    env_file:
      - ./api/.env

    ports:
      - "8080:8080"

    depends_on:
      transaction-dispute-portal-database:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:8080/healthz'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

    networks:
      - transaction-dispute-portal

  transaction-dispute-portal-web:
    image: transaction-dispute-portal-web
    build:
      context: .
      dockerfile: web/Dockerfile

    restart: unless-stopped

    env_file:
      - ./web/.env

    ports:
      - "3000:3000"

    depends_on:
      transaction-dispute-portal-api:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:3000/'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

    networks:
      - transaction-dispute-portal

volumes:
  transaction-dispute-portal-postgres_data:

networks:
  transaction-dispute-portal:
    driver: bridge
