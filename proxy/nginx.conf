events {
	worker_connections 1024;
}

http {
	resolver 127.0.0.11 valid=10s;

	server {
		listen 80;
		server_name localhost;

		set $api_upstream http://transaction-dispute-portal-api:8080;
		set $web_upstream http://transaction-dispute-portal-web:3000;
		set $ntfy_upstream http://transaction-dispute-portal-ntfy;

		location /v1/ {
			proxy_pass $api_upstream;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location = /healthz {
			proxy_pass $api_upstream;
		}

		location = /readyz {
			proxy_pass $api_upstream;
		}

		location /ntfy/ {
			rewrite ^/ntfy/(.*)$ /$1 break;
			proxy_pass $ntfy_upstream;
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_buffering off;
			proxy_read_timeout 1h;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location / {
			proxy_pass $web_upstream;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
	}

	server {
		listen 8025;
		server_name localhost;

		set $mailpit_upstream http://mailpit:8025;

		location / {
			proxy_pass $mailpit_upstream;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
	}

	server {
		listen 8090;
		server_name localhost;

		set $ntfy_ui_upstream http://transaction-dispute-portal-ntfy;

		location / {
			proxy_pass $ntfy_ui_upstream;
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_buffering off;
			proxy_read_timeout 1h;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
	}
}
